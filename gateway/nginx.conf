server {
    listen 80;
    server_name ${DOMAIN_NAME};

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${DOMAIN_NAME};

    ssl_certificate /etc/nginx/ssl/${SSL_CERT_FILE};
    ssl_certificate_key /etc/nginx/ssl/${SSL_KEY_FILE};

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /api/v1/auth/ {
        proxy_pass http://${AUTH_SERVICE_HOST}:${AUTH_SERVICE_PORT}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/products/ {
        proxy_pass http://${PRODUCT_SERVICE_HOST}:${PRODUCT_SERVICE_PORT}/;
        proxy_set_header Host $host;
    }

    location ^~ /api/v1/recommendations {
        rewrite ^/api/v1/recommendations(.*)$ /recommendations$1 break;
        proxy_pass http://${RECOMMENDER_SERVICE_HOST}:${RECOMMENDER_SERVICE_PORT};
        proxy_set_header Host $host;
    }

    location ^~ /api/v1/recommend {
        rewrite ^/api/v1/recommend(.*)$ /recommend$1 break;
        proxy_pass http://${RECOMMENDER_SERVICE_HOST}:${RECOMMENDER_SERVICE_PORT};
        proxy_set_header Host $host;
    }
}
