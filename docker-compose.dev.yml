services:
  postgres-db:
    image: postgres:15-alpine
    container_name: commerce-postgres
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: commerce-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk # Bắt buộc có mã base64 này cho Confluent KRaft
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://${KAFKA_PUBLIC_HOST:-localhost}:${KAFKA_PUBLIC_PORT:-9092},PLAINTEXT_INTERNAL://kafka:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT_INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka_data:/var/lib/kafka/data # Đường dẫn chuẩn của Confluent
  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: commerce-kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
        echo '=> Waiting for Kafka to be ready...';
        cub kafka-ready -b kafka:29092 1 30;
        echo '=> Creating CDC topics for empty tables...';
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic commerce.public.payments      --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic commerce.public.cart          --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic commerce.public.payout_requests --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic commerce.public.reviews       --partitions 1 --replication-factor 1;
        echo '=> Topics created.';
      "
    restart: on-failure

  kafka-connect:
    build: ./infra/kafka-connect
    container_name: commerce-kafka-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: "kafka:29092"
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_CONFIG_PROVIDERS: "env"
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: "org.apache.kafka.common.config.provider.EnvVarConfigProvider"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      - kafka
      - postgres-db

  connect-setup:
    image: curlimages/curl:latest
    container_name: commerce-connect-setup
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./infra/kafka-connect/connectors:/config:ro
    command: |
      sh -c "
        echo '=> Waiting 30s for backend services to seed data...';
        sleep 30;
        echo '=> Kafka Connect is healthy. Registering connectors...';
        curl -s -X POST -H 'Content-Type: application/json' -d @/config/source-postgres.json http://kafka-connect:8083/connectors;
        echo '';
        echo '=> [OK] Source connector registered.';
        curl -s -X POST -H 'Content-Type: application/json' -d @/config/sink-s3.json http://kafka-connect:8083/connectors;
        echo '';
        echo '=> [OK] S3 Sink connector registered.';
        echo '=> All connectors configured successfully. Exiting.';
      "

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: commerce-kafka-ui
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local_kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092


  gateway:
    build: ./gateway
    container_name: commerce-gateway
    restart: always
    ports:
      - "${GATEWAY_PORT}:80"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - GATEWAY_PORT=80
      - AUTH_SERVICE_HOST=${AUTH_SERVICE_HOST}
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT}
      - PRODUCT_SERVICE_HOST=${PRODUCT_SERVICE_HOST}
      - PRODUCT_SERVICE_PORT=${PRODUCT_SERVICE_PORT}
      - CART_SERVICE_HOST=cart-service
      - CART_SERVICE_PORT=${CART_SERVICE_PORT}
      - ORDER_SERVICE_HOST=order_service
      - ORDER_SERVICE_PORT=${ORDER_SERVICE_PORT}
      - PAYMENT_SERVICE_HOST=payment_service
      - PAYMENT_SERVICE_PORT=${PAYMENT_SERVICE_PORT}
      - PAYOUT_SERVICE_HOST=payout_service
      - PAYOUT_SERVICE_PORT=${PAYOUT_SERVICE_PORT:-8008}
      - REVIEW_SERVICE_HOST=review_service
      - REVIEW_SERVICE_PORT=${REVIEW_SERVICE_PORT:-8006}
      - VNPAY_SERVICE_HOST=vnpay_service
      - VNPAY_SERVICE_PORT=${VNPAY_SERVICE_PORT:-8005}
      - KAFKA_UI_HOST=${KAFKA_UI_HOST}
      - KAFKA_UI_PORT=${KAFKA_UI_PORT}
      - ANALYTICS_AGENT_SERVICE_HOST=${ANALYTICS_AGENT_SERVICE_HOST}
      - ANALYTICS_AGENT_SERVICE_PORT=${ANALYTICS_AGENT_SERVICE_PORT}
    networks:
      - default
      - commerce-network
    depends_on:
      product-service:
        condition: service_healthy

  auth-service:
    build: ./services/auth-service
    container_name: commerce-auth-service
    restart: always
    ports:
      - "${AUTH_SERVICE_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      - DEV_AUTO_SEED=true
      - DEV_SEED_FILE=/app/dev-seeds.json
    volumes:
      - ./dev-seeds.json:/app/dev-seeds.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres-db:
          condition: service_healthy
    networks:
      - default
      - commerce-network

  product-service:
    build: ./services/product-service
    container_name: commerce-product-service
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      - PUBLIC_PRODUCTS_BASE_URL=${PUBLIC_PRODUCTS_BASE_URL:-/api/v1/products}
      - DEV_AUTO_SEED=true
      - DEV_SEED_FILE=/app/dev-seeds.json
    ports:
      - "${PRODUCT_SERVICE_PORT:-8001}:8001"
    volumes:
      - ./services/product-service:/app
      - ./dev-seeds.json:/app/dev-seeds.json:ro
    depends_on:
      auth-service:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/books?page=1&page_size=1')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  cart-service:
    build: ./services/cart-service
    container_name: commerce-cart-service
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
    ports:
      - "${CART_SERVICE_PORT:-8002}:8002"
    volumes:
      - .:/services/cart-service
    depends_on:
      - postgres-db
    networks:
      - default
      - commerce-network

  order_service:
    build: ./services/order-service
    container_name: commerce-order-service
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      - DEV_AUTO_SEED=true
      - DEV_SEED_FILE=/seed/dev-seeds.json
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PRODUCT_SERVICE_URL=http://product-service:8001
    ports:
      - "${ORDER_SERVICE_PORT:-8003}:8003"
    volumes:
      - ./services/order-service:/app
      - ./dev-seeds.json:/seed/dev-seeds.json:ro
    depends_on:
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  payment_service:
    build: ./services/payment-service
    container_name: commerce-payment-service
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
    ports:
      - "${PAYMENT_SERVICE_PORT:-8004}:8004"
    volumes:
      - ./services/payment-service:/app
    depends_on:
      - postgres-db

  payout_service:
    build: ./services/payout-service
    container_name: commerce-payout-service
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
    ports:
      - "${PAYOUT_SERVICE_PORT:-8008}:8008"
    volumes:
      - ./services/payout-service:/app
    depends_on:
      - postgres-db

  review_service:
    build: ./services/review-service
    container_name: commerce-review-service
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      - ORDER_SERVICE_URL=http://order_service:8003
      - PRODUCT_SERVICE_URL=http://product-service:8001
      - DEV_AUTO_SEED=true
      - DEV_SEED_FILE=/app/dev-seeds.json
    ports:
      - "${REVIEW_SERVICE_PORT:-8006}:8006"
    volumes:
      - ./dev-seeds.json:/app/dev-seeds.json:ro
    depends_on:
      postgres-db:
        condition: service_healthy
      order_service:
        condition: service_healthy
      product-service:
        condition: service_healthy

  vnpay_service:
    build: ./services/vnpay-service
    container_name: commerce-vnpay-service
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
      - PAYMENT_SERVICE_URL=http://payment_service:8004
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,pay.bookstore.ailab.engineer,bookstore.ailab.engineer
    ports:
      - "${VNPAY_SERVICE_PORT:-8005}:8005"
    volumes:
      - ./services/vnpay-service:/app
    depends_on:
      - postgres-db

  analytics-agent:
    build: ./services/analytics-agent-service
    container_name: commerce-analytics-agent-service
    restart: always
    env_file:
      - .env
    environment:
      - ANALYTICS_AGENT_ROOT_PATH=/api/v1/analytics
    ports:
      - "${ANALYTICS_AGENT_SERVICE_PORT:-8007}:8000"
    volumes:
      - ./services/analytics-agent-service:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: commerce-frontend
    ports:
      - "${FRONTEND_DOCKER_PORT:-5175}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_DEV_PROXY_TARGET=http://gateway:80
      - VITE_HMR_HOST=bookstore.ailab.engineer
      - VITE_HMR_PROTOCOL=wss
      - VITE_HMR_CLIENT_PORT=443
    depends_on:
      - gateway
    networks:
      - default
    
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: commerce-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
  
volumes:
  postgres_data:
  kafka_data:
networks:
  commerce-network:
    driver: bridge
